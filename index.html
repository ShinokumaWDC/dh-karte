<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DHカルテ要約">
  <title>DHカルテ要約</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f6f9; margin: 0; padding: 12px; color: #333; }
    .card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 480px; margin: 0 auto; }
    h2 { margin: 0 0 10px 0; font-size: 16px; text-align: center; color: #2c3e50; }
    .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 8px; }
    .btn-rec { background: #e74c3c; color: #fff; }
    .btn-stop { background: #2c3e50; color: #fff; display: none; }
    .btn-copy { background: #007aff; color: #fff; }
    .status { text-align: center; font-size: 13px; color: #666; margin-bottom: 8px; min-height: 18px; }
    textarea { width: 100%; height: 210px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; padding: 10px; font-size: 14px; line-height: 1.5; margin-bottom: 10px; resize: vertical; }
    .toast { text-align: center; font-size: 13px; color: #27ae60; font-weight: bold; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🦷 DHカルテ音声要約</h2>
    <div id="status" class="status">待機中（Split View / Slide Over対応）</div>
    <button id="recBtn" class="btn btn-rec" onclick="startRecording()">🎙 録音スタート</button>
    <button id="stopBtn" class="btn btn-stop" onclick="stopRecording()">⏹ 停止して要約を作成</button>
    <textarea id="resultText" placeholder="ここに要約が表示されます（コピー前に直接手直しもできます）"></textarea>
    <button class="btn btn-copy" onclick="copyAs6pt()">📋 6ptサイズでコピー</button>
    <div id="toast" class="toast"></div>
  </div>

  <script>
    // ★ここにステップ1で発行したGASのウェブアプリURLを貼り付けます
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzH-AUsD8ZqmrF1v1OsiEeU6Z2XNrs5bfrtnHylkACrxqstJWlXfD2o-GUqSdsRbrD8/exec";

    let mediaRecorder;
    let audioChunks = [];

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = sendAudioToGAS;
        mediaRecorder.start();

        document.getElementById("recBtn").style.display = "none";
        document.getElementById("stopBtn").style.display = "block";
        document.getElementById("status").innerText = "🔴 録音中...（隣でサブカルテ操作OK）";
        document.getElementById("toast").innerText = "";
      } catch (err) {
        alert("マイクの許可が必要です: " + err.message);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        document.getElementById("recBtn").style.display = "block";
        document.getElementById("stopBtn").style.display = "none";
        document.getElementById("status").innerText = "⏳ Geminiで要約を作成中...";
      }
    }

    function sendAudioToGAS() {
      const mimeType = mediaRecorder.mimeType || "audio/mp4";
      const blob = new Blob(audioChunks, { type: mimeType });
      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64data = reader.result.split(",")[1];
        try {
          const res = await fetch(GAS_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ audio: base64data, mimeType: mimeType })
          });
          const data = await res.json();
          if (data.status === "success") {
            document.getElementById("resultText").value = data.text;
            document.getElementById("status").innerText = "✅ 要約完了！（スプレッドシート保存済）";
            copyAs6pt(); // 完了と同時に自動で6ptコピーも実行
          } else {
            document.getElementById("status").innerText = "⚠️ エラー: " + data.message;
          }
        } catch (err) {
          document.getElementById("status").innerText = "⚠️ 通信エラー: " + err.message;
        }
      };
      reader.readAsDataURL(blob);
    }

    async function copyAs6pt() {
      const text = document.getElementById("resultText").value;
      if (!text) return;
      const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
      const htmlContent = `<div style="font-size: 6pt; line-height: 1.2; font-family: sans-serif;">${escaped}</div>`;

      try {
        const blobHtml = new Blob([htmlContent], { type: "text/html" });
        const blobText = new Blob([text], { type: "text/plain" });
        await navigator.clipboard.write([new ClipboardItem({ "text/html": blobHtml, "text/plain": blobText })]);
        document.getElementById("toast").innerText = "✨ 6ptサイズでコピーしました！";
      } catch (e) {
        // フォールバックコピー
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = htmlContent;
        tempDiv.style.position = "fixed";
        tempDiv.style.opacity = "0";
        document.body.appendChild(tempDiv);
        const range = document.createRange();
        range.selectNodeContents(tempDiv);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand("copy");
        document.body.removeChild(tempDiv);
        document.getElementById("toast").innerText = "✨ 6ptサイズでコピーしました！";
      }
    }
  </script>
</body>
</html>
